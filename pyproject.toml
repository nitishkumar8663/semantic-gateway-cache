[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-gateway-cache"
version = "0.1.0"
description = "A semantic gateway cache for local AI: repeats served from cache, actions and live questions never cached"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["semantic_gateway*"]
